name: Validate publish script (validation only)

# SAFETY: automatic build-and-push of monthly history is DISABLED. This workflow
# only checks that the script compiles. dagligepriser.dk has given written
# permission for monthly aggregates, but every publication still needs the
# user's explicit approval.

on:
  pull_request:
    paths:
      - "scripts/publish_monthly_history.py"
      - ".github/workflows/publish-monthly-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check only (no build, no commit, no push)
        run: python -m py_compile scripts/publish_monthly_history.py
