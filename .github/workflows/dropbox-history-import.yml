name: Superkøb privat Dropbox-import (kandidat, ingen publicering)

# KUN manuel kørsel. Workflowet bygger en KANDIDAT og en rapport. Det committer, pusher og publicerer ALDRIG noget.
# Repoet er offentligt: logs og artifacts kan læses af alle. Derfor printes kun antal og normaliserede produktnøgler.
# Ugentlig kørsel må først aktiveres efter en godkendt manuel test (se blokken nedenfor, som er udkommenteret med vilje).
on:
  workflow_dispatch:
    inputs:
      expected_size:
        description: "Forventet filstørrelse i bytes (356964273). Stop hvis Dropbox-filen har en anden størrelse."
        required: true
        default: "356964273"
      allow_size_change:
        description: "Sæt til 'ja' KUN hvis en ny størrelse er forventet (så ignoreres expected_size)."
        required: false
        default: "nej"
  # schedule:
  #   - cron: "17 4 * * 1"   # FØRST efter godkendt manuel test og beslutning fra Casper

permissions:
  contents: read

concurrency:
  group: dropbox-history-import
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secrets ligger i GitHub Environment 'dropbox-import' (krævet godkender + kun main/branch-regler), ikke som repo-secrets.
    environment: dropbox-import
    steps:
      # 'runner' findes ikke i job-level env. Stierne sættes derfor her via RUNNER_TEMP og gælder alle efterfølgende trin (GITHUB_ENV).
      - name: Sæt midlertidige stier (uden for git)
        id: paths
        run: |
          echo "RAW_DIR=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests før import (alle Python-tests)
        id: tests_before
        run: python -m unittest discover -s tests

      - name: Hent privat rådata fra Dropbox (midlertidigt, ikke i git)
        id: fetch
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_RAW_PATH: ${{ vars.DROPBOX_RAW_PATH || '/latest-canonical.json' }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
          ALLOW_SIZE_CHANGE: ${{ inputs.allow_size_change }}
        run: |
          umask 077
          mkdir -p "$RAW_DIR"
          if [ "$ALLOW_SIZE_CHANGE" = "ja" ]; then
            python scripts/dropbox_fetch.py --dest "$RAW_DIR/latest-canonical.json"
          else
            python scripts/dropbox_fetch.py --dest "$RAW_DIR/latest-canonical.json" --expected-size "$EXPECTED_SIZE"
          fi

      - name: Byg kandidat med eksisterende importer (verified_only, ingen match-log)
        id: build
        run: |
          mkdir -p "$OUT_DIR"
          cp price_history.json "$OUT_DIR/price_history.json"
          cp data_sources/history_offer_identities.json "$OUT_DIR/history_offer_identities.json"
          # Kandidatfilerne skal skabes af DENNE kørsel: de må ikke findes på forhånd.
          rm -f "$OUT_DIR/monthly_price_history.json" "$OUT_DIR/history_verification.json"
          date -u +%Y-%m-%dT%H:%M:%S+00:00 > "$RUNNER_TEMP/import.started"
          # stdout/stderr gemmes i temp-filer og vises ALDRIG (offentlig log). Kun en fast fejlbesked og slutresultatets tal.
          if ! python scripts/import_dagligepriser_history.py \
                 --source-file "$RAW_DIR/latest-canonical.json" \
                 --output "$OUT_DIR/monthly_price_history.json" \
                 --current-offers current_offers.json \
                 --identities "$OUT_DIR/history_offer_identities.json" \
                 > "$RUNNER_TEMP/import.out" 2> "$RUNNER_TEMP/import.err"; then
            echo "::error::Historikimport fejlede. Ingen kandidat publiceret."
            exit 1
          fi
          python - <<'PY'
          import json, os
          line = open(os.environ["RUNNER_TEMP"] + "/import.out", encoding="utf-8").read().strip().splitlines()[0]
          s = json.loads(line)
          print(json.dumps({k: v for k, v in s.items() if isinstance(v, (int, float, bool))}, sort_keys=True))
          PY

      - name: Slet rådata så snart importen er færdig
        if: always()
        run: |
          rm -rf "${RAW_DIR:-$RUNNER_TEMP/raw}"
          rm -f "$RUNNER_TEMP/import.out" "$RUNNER_TEMP/import.err"

      - name: Sikkerhedstjek, før/efter-sammenligning og rapport
        id: guard
        run: |
          set +e
          python scripts/history_import_guard.py --before-dir . --after-dir "$OUT_DIR" \
            --started-at "$(cat "$RUNNER_TEMP/import.started")" --report "$OUT_DIR/report.md" --diff "$OUT_DIR/diff.json" > /dev/null
          code=$?
          [ -f "$OUT_DIR/report.md" ] && cat "$OUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Tests og accepttest efter kandidat (repo uændret)
        id: tests_after
        run: |
          python -m unittest discover -s tests
          python scripts/generate_acceptance_report.py --check

      # Kandidatfiler uploades KUN hvis alle trin ovenfor (inkl. history_import_guard) er bestået. Ingen 'if: always()'.
      - name: Upload kun aggregerede kandidatfiler og rapport (ingen rådata)
        uses: actions/upload-artifact@v4
        with:
          name: kandidat-historik
          path: |
            ${{ env.OUT_DIR }}/monthly_price_history.json
            ${{ env.OUT_DIR }}/history_verification.json
            ${{ env.OUT_DIR }}/history_offer_identities.json
            ${{ env.OUT_DIR }}/price_history.json
            ${{ env.OUT_DIR }}/report.md
            ${{ env.OUT_DIR }}/diff.json
          if-no-files-found: error
          retention-days: 7

      # Ved fejl uploades højst en fast, renset fejlrapport: ingen rådata, ingen produktnavne, ingen hemmeligheder, ingen kandidat.
      - name: Fejlrapport (fast tekst)
        if: failure()
        env:
          S_PATHS: ${{ steps.paths.outcome }}
          S_CHECKOUT: ${{ steps.checkout.outcome }}
          S_TESTS_BEFORE: ${{ steps.tests_before.outcome }}
          S_FETCH: ${{ steps.fetch.outcome }}
          S_BUILD: ${{ steps.build.outcome }}
          S_GUARD: ${{ steps.guard.outcome }}
          S_TESTS_AFTER: ${{ steps.tests_after.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/failure"
          # Kun faste ord (success/failure/skipped/cancelled) - aldrig loguddrag, rådata, produktnavne eller hemmeligheder.
          {
            echo "Historikimport fejlede. Ingen kandidat publiceret."
            echo "Trinstatus: stier=$S_PATHS checkout=$S_CHECKOUT tests_foer=$S_TESTS_BEFORE dropbox_hentning=$S_FETCH import=$S_BUILD sikkerhedstjek=$S_GUARD tests_efter=$S_TESTS_AFTER"
          } > "$RUNNER_TEMP/failure/fejlrapport.txt"
          cat "$RUNNER_TEMP/failure/fejlrapport.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fejlrapport
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fejlrapport
          path: ${{ runner.temp }}/failure/fejlrapport.txt
          if-no-files-found: ignore
          retention-days: 7

      # BEVIDST INGEN commit-, push-, merge- eller publiceringstrin. En godkendt kandidat lægges ind via en separat PR.
