name: Publish monthly price history

on:
  push:
    paths:
      - "scripts/publish_monthly_history.py"
      - ".github/workflows/publish-monthly-history.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build monthly history
        run: python scripts/publish_monthly_history.py
      - name: Commit monthly history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly_price_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish dagligepriser.dk monthly history"
          git push
