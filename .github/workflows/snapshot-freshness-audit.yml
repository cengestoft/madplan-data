name: Internal snapshot freshness audit

on:
  schedule:
    - cron: "0 11 * * 3"
    - cron: "0 7 * * 5,0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check snapshot freshness and record reason in artifact
        run: python scripts/audit_snapshot_chain.py --out snapshot_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-freshness-audit
          path: snapshot_audit.json
          retention-days: 30
