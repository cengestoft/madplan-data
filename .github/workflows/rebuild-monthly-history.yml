name: Validate monthly history (validation only)

# SAFETY: this workflow is validation-only. It has read-only permissions, never
# commits or pushes, and never publishes. Rebuilding monthly_price_history.json
# from dagligepriser.dk raw data is DISABLED until the user explicitly approves.
# Written permission for monthly aggregates exists
# (see data_sources/DAGLIGEPRISER_DATA_RIGHTS.md); raw data must still never be public.

on:
  pull_request:
    paths:
      - ".github/workflows/rebuild-monthly-history.yml"
      - "scripts/import_dagligepriser_history.py"
      - "scripts/product_normalization.py"
      - "tests/test_history_overlap.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acceptance tests (read-only)
        run: python -m unittest discover -s tests -v
      - name: Enforce aggregate-only and size limit (read-only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("monthly_price_history.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("raw_data_included") is False
          assert p.stat().st_size < 12*1024*1024
          assert d.get("aggregation") == "normalized_product_key + store + month"
          print({"bytes":p.stat().st_size,"records":len(d.get("records",[]))})
          PY
