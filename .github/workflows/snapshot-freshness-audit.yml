name: Internal snapshot freshness audit

on:
  pull_request:
    paths:
      - "scripts/audit_snapshot_chain.py"
      - "tests/test_audit_snapshot_chain.py"
      - ".github/workflows/snapshot-freshness-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test snapshot audit\n        run: python -m unittest discover -s tests -p test_audit_snapshot_chain.py -v\n      - name: Check snapshot freshness and record reason in artifact
        run: python scripts/audit_snapshot_chain.py --out snapshot_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-freshness-audit
          path: snapshot_audit.json
          retention-days: 30
