name: Source probe (dry run)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/source-probe.yml"
      - "scripts/source_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe every store source (no data written)
        run: python scripts/source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-probe-report
          path: source_probe_report.json
          retention-days: 14
